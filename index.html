<style>
/* Düzen: sol araç paneli | orta tuval | sağ özellik paneli. Arayüz nötr, vurgu Swiss kırmızısı. */
:root{
  --ui-bg:#f1f1ef; --ui-panel:#fafaf9; --ui-line:#d6d6d2; --ui-ink:#161616; --ui-mute:#6d6d68;
  --ui-work:#dcdcd8; --ui-accent:#e3120b; --ui-accent-ink:#ffffff; --ui-field:#ffffff; --ui-hover:#ececea;
  --f-ui:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ui-bg:#151514; --ui-panel:#1d1d1b; --ui-line:#34342f; --ui-ink:#ecece8; --ui-mute:#97978f;
  --ui-work:#0f0f0e; --ui-accent:#ff4a3d; --ui-accent-ink:#111; --ui-field:#262624; --ui-hover:#2a2a27; color-scheme:dark}}
:root[data-theme="dark"]{
  --ui-bg:#151514; --ui-panel:#1d1d1b; --ui-line:#34342f; --ui-ink:#ecece8; --ui-mute:#97978f;
  --ui-work:#0f0f0e; --ui-accent:#ff4a3d; --ui-accent-ink:#111; --ui-field:#262624; --ui-hover:#2a2a27; color-scheme:dark}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-ink);font:13px/1.35 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:44px 1fr;height:100%}
header{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--ui-line);background:var(--ui-panel);min-width:0}
.brand{font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:14px;height:14px;background:var(--ui-accent);display:inline-block}
.sp{flex:1}
.tb{display:flex;gap:4px;align-items:center}
.btn{border:1px solid var(--ui-line);background:var(--ui-field);padding:5px 9px;cursor:pointer;border-radius:2px;white-space:nowrap}
.btn:hover{background:var(--ui-hover)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
.btn.pri{background:var(--ui-accent);color:var(--ui-accent-ink);border-color:var(--ui-accent);font-weight:600}
.btn.on{background:var(--ui-ink);color:var(--ui-bg);border-color:var(--ui-ink)}
.btn.sm{padding:3px 7px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
main{display:grid;grid-template-columns:300px 1fr 292px;min-height:0}
aside{background:var(--ui-panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{border-right:1px solid var(--ui-line)}
#right{border-left:1px solid var(--ui-line)}
.tabs{display:flex;border-bottom:1px solid var(--ui-line)}
.tab{flex:1;padding:9px 4px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--ui-mute);font-weight:500}
.tab[aria-selected="true"]{color:var(--ui-ink);border-bottom-color:var(--ui-accent)}
.pane{overflow:auto;padding:12px;flex:1;min-height:0}
.pane[hidden]{display:none}
h3{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ui-mute);margin:16px 0 8px}
h3:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;min-width:0}
.row>label{flex:0 0 74px;color:var(--ui-mute);font-size:12px}
.row>*{min-width:0}
.row input[type=number],.row input[type=text],.row select,textarea{flex:1;width:100%;background:var(--ui-field);border:1px solid var(--ui-line);padding:4px 6px;border-radius:2px;font-family:var(--f-mono);font-size:12px}
.row input[type=range]{flex:1;accent-color:var(--ui-accent)}
.row output{flex:0 0 38px;text-align:right;font:12px var(--f-mono);color:var(--ui-mute)}
.row input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--ui-line);background:none;cursor:pointer;flex:0 0 34px}
textarea{min-height:76px;resize:vertical;font-family:var(--f-ui)!important;font-size:13px!important}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--ui-line);background:var(--ui-field);padding:4px 8px;cursor:pointer;font-size:12px;border-radius:2px}
.chip:hover{background:var(--ui-hover)}
.chip.on{background:var(--ui-ink);color:var(--ui-bg);border-color:var(--ui-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--ui-line);background:var(--ui-field);cursor:pointer;padding:6px;text-align:left;border-radius:2px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card:hover{border-color:var(--ui-ink)}
.card canvas{width:100%;height:auto;display:block;background:#fff}
.card span{font-size:11.5px;font-weight:500}
.sw{display:flex;height:18px}.sw i{flex:1}
.hint{color:var(--ui-mute);font-size:12px;line-height:1.45;margin:0 0 8px}
.kbd{font:11px var(--f-mono);border:1px solid var(--ui-line);padding:0 4px;border-radius:2px}
#work{background:var(--ui-work);position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;overflow:auto;display:grid;place-items:center;padding:28px;min-height:0}
#cv{display:block;box-shadow:0 2px 24px rgba(0,0,0,.28);touch-action:none;cursor:default;background:#fff}
.zoombar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--ui-line);background:var(--ui-panel);font:12px var(--f-mono);flex-wrap:wrap}
.zoombar .sp{flex:1}
#layers{display:flex;flex-direction:column;border-top:1px solid var(--ui-line);max-height:34%;min-height:90px}
#layers h3{margin:8px 12px 4px}
#layerlist{overflow:auto;padding:0 8px 8px}
.ly{display:flex;align-items:center;gap:4px;padding:3px 4px;cursor:pointer;border-radius:2px;font-size:12px}
.ly:hover{background:var(--ui-hover)}
.ly.sel{background:var(--ui-ink);color:var(--ui-bg)}
.ly .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly button{background:none;border:0;cursor:pointer;opacity:.7;padding:0 3px;color:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--ui-panel);border:1px solid var(--ui-line);width:min(420px,100%);padding:16px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ui-ink);color:var(--ui-bg);padding:7px 12px;border-radius:2px;z-index:60;font-size:12.5px;max-width:90vw}
#toast[hidden]{display:none}
@media (max-width:980px){
  body{overflow:auto}
  #app{height:auto;min-height:100%;grid-template-rows:auto auto}
  header{flex-wrap:wrap;padding:6px 16px;row-gap:6px}
  main{grid-template-columns:1fr;display:flex;flex-direction:column}
  #work{order:1;height:70vh;min-height:360px}
  #left{order:2;border-right:0;border-top:1px solid var(--ui-line)}
  #right{order:3;border-left:0;border-top:1px solid var(--ui-line)}
  .pane{max-height:none;overflow:visible}
  #stage{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
<header>
  <div class="brand"><i></i>Swiss Grid Atölyesi</div>
  <div class="tb">

    <button class="btn sm" id="bRedo" title="Yinele (Shift+Ctrl/⌘+Z)">↷</button>
  </div>
  <div class="tb">
    <button class="btn sm on" id="bGrid" title="Izgarayı göster (G)">Izgara</button>
    <button class="btn sm on" id="bSnap" title="Izgaraya yapış">Yapış</button>
  </div>
  <div class="sp"></div>
  <div class="tb">
    <button class="btn sm" id="bNew">Yeni</button>
    <button class="btn pri" id="bExport">İndir</button>
  </div>
</header>
<main>
<aside id="left">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="page" aria-selected="true">Sayfa</button>
    <button class="tab" role="tab" data-t="comp" aria-selected="false">Düzen</button>
    <button class="tab" role="tab" data-t="add" aria-selected="false">Ekle</button>
    <button class="tab" role="tab" data-t="theme" aria-selected="false">Tema</button>
    <button class="tab" role="tab" data-t="font" aria-selected="false">Yazı</button>
  </div>
  <div class="pane" id="pg-page"></div>
  <div class="pane" id="pg-comp" hidden></div>
  <div class="pane" id="pg-add" hidden></div>
  <div class="pane" id="pg-theme" hidden></div>
  <div class="pane" id="pg-font" hidden></div>
</aside>
<section id="work">
  <div id="stage"><canvas id="cv" width="10" height="10"></canvas></div>
  <div class="zoombar">
    <button class="btn sm" id="zOut">−</button>
    <span id="zVal">100%</span>
    <button class="btn sm" id="zIn">+</button>
    <button class="btn sm" id="zFit">Sığdır</button>
    <span class="sp"></span>
    <span id="sizeInfo"></span>
  </div>
</section>
<aside id="right">
  <div class="pane" id="props"></div>
  <div id="layers"><h3>Katmanlar</h3><div id="layerlist"></div></div>
</aside>
</main>
</div>

<div class="modal" id="mExport" hidden>
  <div class="sheet" role="dialog" aria-labelledby="exT">
    <h2 id="exT">Görseli indir</h2>
    <div class="row"><label>Biçim</label>
      <div class="chips" id="exFmt">
        <button class="chip on" data-f="png">PNG</button>
        <button class="chip" data-f="jpg">JPG</button>
        <button class="chip" data-f="webp">WebP</button>
        <button class="chip" data-f="pdf">PDF</button>
        <button class="chip" data-f="svg">SVG</button>
        <button class="chip" data-f="json">Proje</button>
      </div>
    </div>
    <div class="row" id="exScaleRow"><label>Ölçek</label>
      <div class="chips" id="exScale">
        <button class="chip" data-s="1">1×</button>
        <button class="chip on" data-s="2">2×</button>
        <button class="chip" data-s="3">3×</button>
        <button class="chip" data-s="4">4×</button>
      </div>
    </div>
    <div class="row" id="exQRow"><label>Kalite</label><input type="range" id="exQ" min="50" max="100" value="92"><output id="exQo">92</output></div>
    <div class="row" id="exTRow"><label>Zemin</label><label style="flex:1;color:var(--ui-ink)"><input type="checkbox" id="exTrans"> Saydam (yalnız PNG/WebP)</label></div>
    <p class="hint" id="exInfo"></p>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn" id="exCancel">Kapat</button>
      <button class="btn pri" id="exGo">İndir</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2,.ttc,font/*" multiple hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileProj" accept="application/json,.json" hidden>

/* ---------- Izgara hesapları ---------- */
function gm(){const g=S.grid,p=S.page;return{cw:(p.w-g.ml-g.mr-g.gut*(g.cols-1))/g.cols,rh:(p.h-g.mt-g.mb-g.gut*(g.rows-1))/g.rows}}
function cell(c,r,cs,rs){const g=S.grid,m=gm();return{x:g.ml+c*(m.cw+g.gut),y:g.mt+r*(m.rh+g.gut),w:cs*m.cw+(cs-1)*g.gut,h:rs*m.rh+(rs-1)*g.gut}}
function fr(a,b,c,d){
  /* Yatay: kolonlara oturur. Dikey: kenar boşlukları içindeki alanın oranı (satır sayısından bağımsız). */
  const g=S.grid,p=S.page;
  const c0=clamp(Math.round(a*g.cols),0,g.cols-1); let c1=clamp(Math.round((a+c)*g.cols),1,g.cols); if(c1<=c0)c1=c0+1;
  const cs=c1-c0;
  const x=cell(c0,0,cs,1), liveH=p.h-g.mt-g.mb;
  return{x:x.x,w:x.w,y:g.mt+b*liveH,h:Math.max(2,d*liveH)};
}
function gridLines(){
  const g=S.grid,m=gm(),xs=[0,S.page.w/2,S.page.w],ys=[0,S.page.h/2,S.page.h];
  for(let i=0;i<g.cols;i++){const x=g.ml+i*(m.cw+g.gut);xs.push(x,x+m.cw)}
  for(let j=0;j<g.rows;j++){const y=g.mt+j*(m.rh+g.gut);ys.push(y,y+m.rh)}
  return{xs,ys};
}
const unit=()=>Math.min(S.page.w,S.page.h)/100;

const H={u:[],r:[]};
function snapshot(){return JSON.stringify({page:S.page,grid:S.grid,T:S.T,els:S.els,sel:S.sel})}
function commit(){
  const s=snapshot(); if(H.u.length&&H.u[H.u.length-1]===s)return;
  H.u.push(s); if(H.u.length>80)H.u.shift(); H.r=[]; saveSoon(); updHist();
}
function restore(s){
  const o=JSON.parse(s); S.page=o.page;S.grid=o.grid;S.T=o.T;S.els=o.els;
  S.sel=o.sel&&S.els.some(e=>e.id===o.sel)?o.sel:null; fullRefresh();
}
function undo(){if(H.u.length<2)return;H.r.push(H.u.pop());restore(H.u[H.u.length-1]);updHist()}
function redo(){if(!H.r.length)return;const s=H.r.pop();H.u.push(s);restore(s);updHist()}
function updHist(){$('#bUndo').disabled=H.u.length<2;$('#bRedo').disabled=!H.r.length}
let saveT=0;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,500)}
function projectJSON(withImgs,withFonts){
  const imgs={}; if(withImgs)for(const k in S.imgs)imgs[k]=S.imgs[k].url;
  return JSON.stringify({v:1,page:S.page,grid:S.grid,T:S.T,els:S.els,ui:S.ui,imgs,fonts:withFonts?customFontsData():[],gfonts:withFonts?GF.map(g=>g.name):[]});
}

/* Seçili öğeyi (veya tümünü) en yakın ızgara çizgilerine oturtur */
function snapRect(e){
  if(Math.abs(e.rot%180)>0.01)return;
  const g=S.grid,m=gm(),sx=[],ex=[],sy=[],ey=[];
  for(let i=0;i<g.cols;i++){const x=g.ml+i*(m.cw+g.gut);sx.push(x);ex.push(x+m.cw)}
  for(let j=0;j<g.rows;j++){const y=g.mt+j*(m.rh+g.gut);sy.push(y);ey.push(y+m.rh)}
  const near=(v,a)=>a.reduce((b,c)=>Math.abs(c-v)<Math.abs(b-v)?c:b,a[0]);
  let x0=near(e.x,sx),x1=near(e.x+e.w,ex); if(x1<=x0)x1=ex[sx.indexOf(x0)];
  let y0=near(e.y,sy),y1=near(e.y+e.h,ey); if(y1<=y0)y1=ey[sy.indexOf(y0)];
  if(e.type==='circle'||e.type==='rect'&&e.h<12){e.x=x0;e.w=x1-x0;if(e.type==='circle'){e.y=y0;e.h=y1-y0}else{e.y=near(e.y,sy.concat(ey))}}
  else{e.x=x0;e.y=y0;e.w=x1-x0;e.h=y1-y0}
}

const DSP=o=>Object.assign({role:'display',weight:800,lh:.95,ls:-1,name:'Başlık'},o||{});
const BODY=(z,o)=>Object.assign({size:z.s*1.1,lh:1.4,name:'Gövde',clip:true},o||{});
function blk(a,b,c,d){
  const g=S.grid,r=fr(a,b,c,d),gp=g.gut/2,top=b>.001?gp:0,bot=(b+d)<.999?gp:0;
  return{x:r.x,w:r.w,y:r.y+top,h:Math.max(2,r.h-top-bot)};
}

/* ---------- Çizim motoru (düzenleme, önizleme ve dışa aktarma aynı kodu kullanır) ---------- */
const LSUP=('letterSpacing' in CanvasRenderingContext2D.prototype);
let ED=false;
function setFont(ctx,e,size){
  const f=fontOf(e); ensureFont(f,e.weight);
  ctx.font=(e.ital?'italic ':'')+e.weight+' '+size+'px "'+f+'", "Helvetica Neue", Arial, sans-serif';
}
const tw=(ctx,t,ls)=>ctx.measureText(t).width+(ls?ls*Math.max(0,t.length-1):0);
function layoutText(ctx,e,size){
  setFont(ctx,e,size);
  const txt=e.upper?e.text.toLocaleUpperCase('tr'):e.text, lines=[];
  txt.split('\n').forEach(par=>{
    if(par===''){lines.push({t:'',w:0});return}
    let cur='';
    par.split(/ +/).forEach(w=>{
      const test=cur?cur+' '+w:w;
      if(cur&&tw(ctx,test,e.ls)>e.w){lines.push({t:cur,w:tw(ctx,cur,e.ls)});cur=w}else cur=test;
    });
    lines.push({t:cur,w:tw(ctx,cur,e.ls)});
  });
  const capH=ctx.measureText('H').actualBoundingBoxAscent||size*.7;
  const lt=lines.length?lines[lines.length-1].t:'', desc=lt?(ctx.measureText(lt).actualBoundingBoxDescent||0):0;
  return{lines,size,capH,desc,step:size*e.lh};
}
function fitSize(ctx,e){
  const key=[e.text,e.w,e.h,e.weight,fontOf(e),e.lh,e.ls,e.upper,e.ital].join('|');
  if(fitCache[key])return fitCache[key];
  let lo=4,hi=Math.max(60,e.h*1.3+e.w*.5);
  for(let i=0;i<18;i++){
    const mid=(lo+hi)/2,L=layoutText(ctx,e,mid);
    const bh=L.capH+(L.lines.length-1)*L.step+L.desc, mw=Math.max.apply(null,L.lines.map(l=>l.w));
    if(bh<=e.h&&mw<=e.w+.5)lo=mid;else hi=mid;
  }
  return fitCache[key]=lo;
}
/* Satırları kutu içindeki konumlarıyla verir; SVG dışa aktarma da bunu kullanır. */
function textPlan(ctx,e){
  const size=e.fit?fitSize(ctx,e):e.size, L=layoutText(ctx,e,size);
  const bh=L.capH+(L.lines.length-1)*L.step+(e.fit?L.desc:0);
  const y0=e.valign==='middle'?(e.h-bh)/2:e.valign==='bottom'?e.h-bh:0;
  let items=L.lines.map((l,i)=>({t:l.t,w:l.w,y:y0+L.capH+i*L.step,x:e.align==='center'?(e.w-l.w)/2:e.align==='right'?e.w-l.w:0}));
  if(e.clip&&!e.fit&&e.valign==='top'){const k=items.filter(it=>it.y+size*.22<=e.h+.5);items=k.length?k:items.slice(0,1)}
  return{size,items};
}
function drawStr(ctx,t,x,y,ls){
  if(!ls){ctx.fillText(t,x,y);return}
  if(LSUP){ctx.letterSpacing=ls+'px';ctx.fillText(t,x,y);ctx.letterSpacing='0px';return}
  let cx=x; for(const ch of t){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+ls}
}
function drawText(ctx,e){
  const P=textPlan(ctx,e); setFont(ctx,e,P.size);
  ctx.fillStyle=col(e.color); ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  P.items.forEach(it=>{if(it.t)drawStr(ctx,it.t,it.x,it.y,e.ls)});
}

/* ---------- Görsel efektleri ---------- */
const pcache=new Map();
function hex2rgb(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function procImage(e){
  const im=S.imgs[e.img]; if(!im||!im.el.complete||!im.w)return null;
  if(e.fx==='none'&&!e.bright&&!e.contrast)return im.el;
  const key=[e.img,e.fx,e.bright,e.contrast,e.level,e.cell,col(e.c1),col(e.c2)].join('|');
  if(pcache.has(key))return pcache.get(key);
  const sc=Math.min(1,1400/Math.max(im.w,im.h)), w=Math.max(1,Math.round(im.w*sc)), h=Math.max(1,Math.round(im.h*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(im.el,0,0,w,h);
  const d=x.getImageData(0,0,w,h), p=d.data, b=e.bright*2.55, cc=e.contrast*2.55;
  const k=(259*(cc+255))/(255*(259-cc)), c1=hex2rgb(col(e.c1)), c2=hex2rgb(col(e.c2)), lv=e.level*2.55;
  const cl=v=>v<0?0:v>255?255:v;
  for(let i=0;i<p.length;i+=4){
    let r=cl(k*(p[i]+b-128)+128), g=cl(k*(p[i+1]+b-128)+128), bl=cl(k*(p[i+2]+b-128)+128);
    const l=.299*r+.587*g+.114*bl;
    if(e.fx==='gray'||e.fx==='halftone'){r=g=bl=l}
    else if(e.fx==='thresh'){const hi=l>=lv;r=hi?c2[0]:c1[0];g=hi?c2[1]:c1[1];bl=hi?c2[2]:c1[2]}
    else if(e.fx==='duo'){const t=l/255;r=c1[0]+(c2[0]-c1[0])*t;g=c1[1]+(c2[1]-c1[1])*t;bl=c1[2]+(c2[2]-c1[2])*t}
    p[i]=r;p[i+1]=g;p[i+2]=bl;
  }
  x.putImageData(d,0,0);
  let out=c;
  if(e.fx==='halftone'){
    const o=document.createElement('canvas'); o.width=w; o.height=h; const ox=o.getContext('2d');
    ox.fillStyle=col(e.c2); ox.fillRect(0,0,w,h); ox.fillStyle=col(e.c1);
    const cell=Math.max(3,e.cell*(w/700));
    for(let cy=cell/2;cy<h;cy+=cell)for(let cxp=cell/2;cxp<w;cxp+=cell){
      const ix=Math.min(w-1,Math.round(cxp)), iy=Math.min(h-1,Math.round(cy));
      const l=p[(iy*w+ix)*4]/255, r=cell*.5*Math.sqrt(1-l)*1.18;
      if(r>.25){ox.beginPath();ox.arc(cxp,cy,r,0,6.2832);ox.fill()}
    }
    out=o;
  }
  if(pcache.size>14)pcache.clear();
  pcache.set(key,out); return out;
}

/* ---------- Öğe çizimi ---------- */
function rrect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); ctx.beginPath();
  if(r<=0){ctx.rect(x,y,w,h);return}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawPattern(ctx,e){
  const w=e.w,h=e.h,s=Math.max(3,e.size); ctx.save(); ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip();
  ctx.fillStyle=ctx.strokeStyle=col(e.color); ctx.lineWidth=e.sw;
  const k=e.kind;
  if(k==='dots'){for(let y=s/2;y<h+s;y+=s)for(let x=s/2;x<w+s;x+=s){ctx.beginPath();ctx.arc(x,y,s*.3,0,6.2832);ctx.fill()}}
  else if(k==='halftone'){
    const D=Math.hypot(w,h);
    for(let y=s/2;y<h+s;y+=s)for(let x=s/2;x<w+s;x+=s){const t=1-Math.hypot(w-x,y)/D, r=s*.56*Math.max(0,Math.min(1,t*1.15));if(r>.3){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill()}}}
  else if(k==='stripes'){for(let x=0;x<w;x+=s*2)ctx.fillRect(x,0,s,h)}
  else if(k==='hlines'){for(let y=0;y<h;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
  else if(k==='diag'){for(let d=-h;d<w;d+=s){ctx.beginPath();ctx.moveTo(d,h);ctx.lineTo(d+h,0);ctx.stroke()}}
  else if(k==='grid'){for(let x=0;x<=w;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<=h;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
  else if(k==='rings'){const R=Math.hypot(w,h);for(let r=s;r<R;r+=s){ctx.beginPath();ctx.arc(w/2,h/2,r,0,6.2832);ctx.stroke()}}
  else if(k==='checker'){for(let j=0;j*s<h;j++)for(let i=0;i*s<w;i++)if((i+j)%2===0)ctx.fillRect(i*s,j*s,s,s)}
  ctx.restore();
}
function drawImageEl(ctx,e){
  const w=e.w,h=e.h, src=procImage(e);
  if(!src){
    if(!ED)return;
    ctx.fillStyle=col('muted'); ctx.globalAlpha*=.35; rrect(ctx,0,0,w,h,e.rad||0); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=col('fg'); ctx.globalAlpha=.35; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(0,0);ctx.lineTo(w,h);ctx.moveTo(w,0);ctx.lineTo(0,h);ctx.stroke(); ctx.globalAlpha=1;
    const fs=Math.max(8,Math.min(14,w/18)); ctx.fillStyle=col('fg'); ctx.font='500 '+fs+'px "IBM Plex Mono",monospace';
    ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText('GÖRSEL — çift tıkla',8,8); return;
  }
  const sw=src.naturalWidth||src.width, sh=src.naturalHeight||src.height;
  ctx.save(); rrect(ctx,0,0,w,h,e.rad||0); ctx.clip();
  const s=e.fit==='contain'?Math.min(w/sw,h/sh):Math.max(w/sw,h/sh), dw=sw*s, dh=sh*s;
  const dx=e.fit==='contain'?(w-dw)/2:(w-dw)*e.fx0, dy=e.fit==='contain'?(h-dh)/2:(h-dh)*e.fy0;
  ctx.drawImage(src,dx,dy,dw,dh); ctx.restore();
}
function drawEl(ctx,e){
  if(e.hide)return;
  ctx.save(); ctx.globalAlpha=e.op;
  ctx.translate(e.x+e.w/2,e.y+e.h/2); if(e.rot)ctx.rotate(e.rot*Math.PI/180); ctx.translate(-e.w/2,-e.h/2);
  const t=e.type;
  if(t==='rect'){
    if(e.fill){ctx.fillStyle=col(e.fill);rrect(ctx,0,0,e.w,e.h,e.rad);ctx.fill()}
    if(e.stroke&&e.sw){ctx.strokeStyle=col(e.stroke);ctx.lineWidth=e.sw;rrect(ctx,e.sw/2,e.sw/2,e.w-e.sw,e.h-e.sw,e.rad);ctx.stroke()}
  }else if(t==='circle'){
    ctx.beginPath(); ctx.ellipse(e.w/2,e.h/2,Math.max(.1,e.w/2),Math.max(.1,e.h/2),0,0,6.2832);
    if(e.fill){ctx.fillStyle=col(e.fill);ctx.fill()}
    if(e.stroke&&e.sw){ctx.strokeStyle=col(e.stroke);ctx.lineWidth=e.sw;ctx.beginPath();ctx.ellipse(e.w/2,e.h/2,Math.max(.1,e.w/2-e.sw/2),Math.max(.1,e.h/2-e.sw/2),0,0,6.2832);ctx.stroke()}
  }else if(t==='text')drawText(ctx,e);
  else if(t==='pattern')drawPattern(ctx,e);
  else if(t==='image')drawImageEl(ctx,e);
  ctx.restore();
}
function drawScene(ctx,els,o){
  o=o||{}; ED=!!o.ed;
  if(o.bg!==false){ctx.fillStyle=col('bg');ctx.fillRect(0,0,S.page.w,S.page.h)}
  els.forEach(e=>drawEl(ctx,e)); ED=false;
}

/* ---------- Ana tuval ---------- */
const cv=$('#cv'), cx=cv.getContext('2d');
let rafId=0, guides=[];
function needRender(){if(!rafId)rafId=requestAnimationFrame(()=>{rafId=0;render()})}
function toWorld(e,lx,ly){
  const a=e.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a),dx=lx-e.w/2,dy=ly-e.h/2;
  return{x:e.x+e.w/2+dx*c-dy*s,y:e.y+e.h/2+dx*s+dy*c};
}
function toLocal(e,px,py){
  const a=-e.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a),dx=px-(e.x+e.w/2),dy=py-(e.y+e.h/2);
  return{x:dx*c-dy*s+e.w/2,y:dx*s+dy*c+e.h/2};
}
const HANDLES=[[0,0],[.5,0],[1,0],[1,.5],[1,1],[.5,1],[0,1],[0,.5]];
function render(){
  const p=S.page, dpr=window.devicePixelRatio||1; let s=S.zoom*dpr;
  if(p.w*s>6000||p.h*s>6000)s=Math.min(6000/p.w,6000/p.h);
  const bw=Math.round(p.w*s), bh=Math.round(p.h*s);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh}
  cv.style.width=Math.round(p.w*S.zoom)+'px'; cv.style.height=Math.round(p.h*S.zoom)+'px';
  cx.setTransform(bw/p.w,0,0,bh/p.h,0,0); cx.clearRect(0,0,p.w,p.h);
  drawScene(cx,S.els,{ed:true});
  drawOverlay(cx);
  $('#zVal').textContent=Math.round(S.zoom*100)+'%';
}
function drawOverlay(ctx){
  const g=S.grid,m=gm(),z=1/S.zoom;
  if(S.ui.grid){
    ctx.save();
    ctx.fillStyle='rgba(255,40,110,.10)'; ctx.strokeStyle='rgba(255,40,110,.55)'; ctx.lineWidth=z;
    for(let j=0;j<g.rows;j++)for(let i=0;i<g.cols;i++){const r=cell(i,j,1,1);ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeRect(r.x,r.y,r.w,r.h)}
    ctx.setLineDash([6*z,4*z]); ctx.strokeStyle='rgba(0,120,255,.7)';
    ctx.strokeRect(g.ml,g.mt,S.page.w-g.ml-g.mr,S.page.h-g.mt-g.mb);
    ctx.setLineDash([]);
    if(g.base>0){ctx.strokeStyle='rgba(0,170,255,.35)';ctx.lineWidth=z*.7;ctx.beginPath();
      for(let y=g.mt;y<=S.page.h-g.mb+.1;y+=g.base){ctx.moveTo(g.ml,y);ctx.lineTo(S.page.w-g.mr,y)}ctx.stroke()}
    ctx.restore();
  }
  guides.forEach(q=>{ctx.save();ctx.strokeStyle='#ff00aa';ctx.lineWidth=z*1.2;ctx.beginPath();
    if(q.x!==undefined){ctx.moveTo(q.x,0);ctx.lineTo(q.x,S.page.h)}else{ctx.moveTo(0,q.y);ctx.lineTo(S.page.w,q.y)}ctx.stroke();ctx.restore()});
  const e=sel(); if(!e||e.hide)return;
  ctx.save(); ctx.strokeStyle='#1a73ff'; ctx.lineWidth=1.5*z; ctx.fillStyle='#fff';
  const c=[[0,0],[e.w,0],[e.w,e.h],[0,e.h]].map(q=>toWorld(e,q[0],q[1]));
  ctx.beginPath(); c.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.closePath(); ctx.stroke();
  if(!e.lock){const hs=8*z;HANDLES.forEach(h=>{const q=toWorld(e,h[0]*e.w,h[1]*e.h);ctx.fillRect(q.x-hs/2,q.y-hs/2,hs,hs);ctx.strokeRect(q.x-hs/2,q.y-hs/2,hs,hs)})}
  ctx.restore();
}
function fitZoom(){
  const st=$('#stage'), aw=st.clientWidth-(innerWidth<=980?28:56), ah=st.clientHeight-(innerWidth<=980?28:56);
  S.zoom=clamp(Math.min(aw/S.page.w,ah/S.page.h),.05,4); S.fit=true;
}
function setZoom(z){S.zoom=clamp(z,.05,4);S.fit=false;needRender()}


/* ---------- Etkileşim: seçme, taşıma, boyutlandırma, klavye ---------- */
let drag=null;
function pagePt(ev){
  const r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left)/r.width*S.page.w,y:(ev.clientY-r.top)/r.height*S.page.h};
}
function hitEl(px,py){
  for(let i=S.els.length-1;i>=0;i--){
    const e=S.els[i]; if(e.hide||e.lock)continue;
    const q=toLocal(e,px,py);
    if(q.x>=0&&q.y>=0&&q.x<=e.w&&q.y<=e.h)return e;
  }
  return null;
}
function hitHandle(e,px,py){
  if(!e||e.lock||e.hide)return -1;
  const tol=9/S.zoom;
  for(let i=0;i<HANDLES.length;i++){
    const q=toWorld(e,HANDLES[i][0]*e.w,HANDLES[i][1]*e.h);
    if(Math.abs(q.x-px)<=tol&&Math.abs(q.y-py)<=tol)return i;
  }
  return -1;
}
function snapVal(vals,lines,tol){
  let best=null;
  vals.forEach(v=>lines.forEach(l=>{const d=Math.abs(l-v);if(d<=tol&&(!best||d<best.d))best={d,l,v}}));
  return best;
}
const CURS=['nwse-resize','ns-resize','nesw-resize','ew-resize','nwse-resize','ns-resize','nesw-resize','ew-resize'];

cv.addEventListener('pointerdown',ev=>{
  if(ev.button!==0)return;
  const pt=pagePt(ev), cur=sel(), hi=hitHandle(cur,pt.x,pt.y);
  if(hi>=0){
    cv.setPointerCapture(ev.pointerId);
    drag={mode:'resize',h:hi,id:cur.id,o:{x:cur.x,y:cur.y,w:cur.w,h:cur.h},start:pt};
    return;
  }
  const e=hitEl(pt.x,pt.y);
  S.sel=e?e.id:null;
  if(e){
    cv.setPointerCapture(ev.pointerId);
    drag={mode:'move',id:e.id,o:{x:e.x,y:e.y},start:pt,moved:false};
  }
  buildProps(); buildLayers(); needRender();
});
cv.addEventListener('pointermove',ev=>{
  const pt=pagePt(ev);
  if(!drag){
    const cur=sel(), hi=hitHandle(cur,pt.x,pt.y);
    cv.style.cursor=hi>=0?CURS[hi]:(hitEl(pt.x,pt.y)?'move':'default'); return;
  }
  const e=S.els.find(q=>q.id===drag.id); if(!e)return;
  const tol=7/S.zoom, L=gridLines(); guides=[];
  if(drag.mode==='move'){
    let nx=drag.o.x+(pt.x-drag.start.x), ny=drag.o.y+(pt.y-drag.start.y);
    if(!drag.moved&&Math.hypot(pt.x-drag.start.x,pt.y-drag.start.y)<2/S.zoom)return;
    drag.moved=true;
    if(S.ui.snap&&!ev.altKey&&!e.rot){
      const bx=snapVal([nx,nx+e.w,nx+e.w/2],L.xs,tol), by=snapVal([ny,ny+e.h,ny+e.h/2],L.ys,tol);
      if(bx){nx+=bx.l-bx.v;guides.push({x:bx.l})}
      if(by){ny+=by.l-by.v;guides.push({y:by.l})}
    }
    e.x=nx;e.y=ny;
  }else{
    const o=drag.o, a=e.rot*Math.PI/180, c=Math.cos(a), s=Math.sin(a), hh=HANDLES[drag.h];
    const sx=hh[0]===0?-1:hh[0]===1?1:0, sy=hh[1]===0?-1:hh[1]===1?1:0;
    let wx=pt.x, wy=pt.y;
    if(S.ui.snap&&!ev.altKey&&!e.rot){
      if(sx){const b=snapVal([wx],L.xs,tol);if(b){wx=b.l;guides.push({x:b.l})}}
      if(sy){const b=snapVal([wy],L.ys,tol);if(b){wy=b.l;guides.push({y:b.l})}}
    }
    const dx=wx-drag.start.x, dy=wy-drag.start.y;
    const ldx=dx*c+dy*s, ldy=-dx*s+dy*c;
    let nw=o.w+sx*ldx, nh=o.h+sy*ldy;
    if(ev.shiftKey&&sx&&sy){const k=Math.max(nw/o.w,nh/o.h);nw=o.w*k;nh=o.h*k}
    nw=Math.max(4,nw); nh=Math.max(4,nh);
    const cdx=sx?(nw-o.w)/2*sx:0, cdy=sy?(nh-o.h)/2*sy:0;
    const ocx=o.x+o.w/2, ocy=o.y+o.h/2;
    const ncx=ocx+cdx*c-cdy*s, ncy=ocy+cdx*s+cdy*c;
    e.w=nw; e.h=nh; e.x=ncx-nw/2; e.y=ncy-nh/2;
  }
  needRender(); syncGeom();
});
function endDrag(){
  if(!drag)return; drag=null; guides=[]; commit(); buildProps(); needRender();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('dblclick',ev=>{
  const pt=pagePt(ev), e=hitEl(pt.x,pt.y); if(!e)return;
  S.sel=e.id; buildProps(); buildLayers(); needRender();
  if(e.type==='text'){const t=$('#pText');if(t){t.focus();t.select()}}
  else if(e.type==='image')pickImage(e.id);
});
$('#stage').addEventListener('pointerdown',ev=>{
  if(ev.target.id==='stage'&&S.sel){S.sel=null;buildProps();buildLayers();needRender()}
});
$('#stage').addEventListener('wheel',ev=>{
  if(!(ev.ctrlKey||ev.metaKey))return; ev.preventDefault();
  setZoom(S.zoom*(ev.deltaY<0?1.1:1/1.1));
},{passive:false});

/* Klavye */
document.addEventListener('keydown',ev=>{
  const tag=(ev.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||tag==='select';
  const mod=ev.ctrlKey||ev.metaKey;
  if(mod&&ev.key.toLowerCase()==='z'&&!typing){ev.preventDefault();ev.shiftKey?redo():undo();return}
  if(mod&&ev.key.toLowerCase()==='y'&&!typing){ev.preventDefault();redo();return}
  if(typing)return;
  const e=sel();
  if(mod&&ev.key.toLowerCase()==='d'&&e){ev.preventDefault();dupSel();return}
  if(ev.key==='g'||ev.key==='G'){toggleGrid();return}
  if(ev.key==='Escape'){S.sel=null;buildProps();buildLayers();needRender();return}
  if(!e||e.lock)return;
  if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();delSel();return}
  if(ev.key==='['){ev.preventDefault();reorder(-1);return}
  if(ev.key===']'){ev.preventDefault();reorder(1);return}
  const st=ev.shiftKey?10:1;
  let moved=true;
  if(ev.key==='ArrowLeft')e.x-=st;else if(ev.key==='ArrowRight')e.x+=st;
  else if(ev.key==='ArrowUp')e.y-=st;else if(ev.key==='ArrowDown')e.y+=st;else moved=false;
  if(moved){ev.preventDefault();needRender();syncGeom();clearTimeout(document._nt);document._nt=setTimeout(commit,350)}
});

/* ---------- Öğe işlemleri ---------- */
function addEl(e){S.els.push(e);S.sel=e.id;commit();buildProps();buildLayers();needRender()}
function delSel(){const e=sel();if(!e)return;S.els=S.els.filter(q=>q.id!==e.id);S.sel=null;commit();buildProps();buildLayers();needRender()}
function dupSel(){
  const e=sel(); if(!e)return; const c=JSON.parse(JSON.stringify(e));
  c.id=nid(); c.x+=14; c.y+=14; S.els.push(c); S.sel=c.id; commit(); buildProps(); buildLayers(); needRender();
}
function reorder(d){
  const i=S.els.findIndex(q=>q.id===S.sel); if(i<0)return; const j=clamp(i+d,0,S.els.length-1); if(i===j)return;
  const [e]=S.els.splice(i,1); S.els.splice(j,0,e); commit(); buildLayers(); needRender();
}
function toggleGrid(){S.ui.grid=!S.ui.grid;$('#bGrid').classList.toggle('on',S.ui.grid);needRender();saveSoon()}
function alignSel(k){
  const e=sel(); if(!e)return; const g=S.grid, p=S.page;
  if(Math.abs(e.rot%180)>.01){toast('Döndürülmüş öğede hizalama kapalı');return}
  if(k==='l')e.x=g.ml; if(k==='c')e.x=(p.w-e.w)/2; if(k==='r')e.x=p.w-g.mr-e.w;
  if(k==='t')e.y=g.mt; if(k==='m')e.y=(p.h-e.h)/2; if(k==='b')e.y=p.h-g.mb-e.h;
  commit(); buildProps(); needRender();
}

/* Görsel yükleme */
let imgTarget=null;
function pickImage(id){imgTarget=id||null;$('#fileImg').value='';$('#fileImg').click()}
function loadImage(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,2000/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const url=c.toDataURL('image/jpeg',.86), id='i'+Date.now().toString(36)+Math.floor(Math.random()*999);
      const el=new Image(); el.onload=()=>{S.imgs[id]={el,url,w:c.width,h:c.height};cb(id)}; el.src=url;
    };
    im.onerror=()=>toast('Görsel okunamadı');
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
}
$('#fileImg').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f)return;
  loadImage(f,id=>{
    const t=imgTarget&&S.els.find(q=>q.id===imgTarget);
    if(t){t.img=id}else{
      const m=fr(0,0,1,.5), e=eImage(m,{img:id}); S.els.push(e); S.sel=e.id;
    }
    imgTarget=null; commit(); buildProps(); buildLayers(); needRender();
  });
});
document.addEventListener('dragover',ev=>ev.preventDefault());
document.addEventListener('drop',ev=>{
  ev.preventDefault(); const f=ev.dataTransfer&&ev.dataTransfer.files[0];
  if(!f||!/^image\//.test(f.type))return;
  const pt=pagePt(ev), t=hitEl(pt.x,pt.y);
  loadImage(f,id=>{
    if(t&&t.type==='image'){t.img=id}else{const e=eImage(fr(0,0,1,.5),{img:id});S.els.push(e);S.sel=e.id}
    commit(); buildProps(); buildLayers(); needRender();

/* ---------- Arayüz yardımcıları ---------- */
function h(tag,a,kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v===undefined||v===null)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e[k]=v;else e.setAttribute(k,v)}
  (kids||[]).forEach(c=>{if(c)e.append(c)});
  return e;
}
const row=(label,...ctl)=>h('div',{class:'row'},[label?h('label',{text:label}):null,...ctl]);
function numIn(get,set,o){
  o=o||{}; const i=h('input',{type:'number',step:o.step||1,min:o.min,max:o.max,'aria-label':o.label||''});
  i.value=r2(get()); if(o.g)i.dataset.g=o.g;
  i.oninput=()=>{const v=parseFloat(i.value);if(isNaN(v))return;set(v);if(o.live)o.live();needRender()};
  i.onchange=()=>{commit();if(o.done)o.done()};
  return i;
}
function rangeIn(get,set,o){
  const i=h('input',{type:'range',min:o.min,max:o.max,step:o.step||1}), out=h('output');
  const fmt=()=>{out.textContent=r2(+i.value)+(o.unit||'')};
  i.value=get(); fmt();
  i.oninput=()=>{set(parseFloat(i.value));fmt();if(o.live)o.live();needRender()};
  i.onchange=()=>{commit();if(o.done)o.done()};
  return[i,out];
}
function selIn(opts,get,set,done){

    if(o.group){const g=h('optgroup',{label:o.group});o.items.forEach(it=>g.append(h('option',{value:it[0],text:it[1]})));s.append(g)}
    else s.append(h('option',{value:o[0],text:o[1]}));

}
function chipsIn(opts,get,set,done){

    S.els.forEach(e=>{e.x*=sx;e.w*=sx;e.y*=sy;e.h*=sy;if(e.type==='text'){e.size=r2(e.size*k)}if(e.sw)e.sw=r2(e.sw*k);if(e.type==='pattern')e.size=r2(e.size*k)});
    const g=S.grid;['mt','mr','mb','ml','gut','base'].forEach(q=>g[q]=r2(g[q]*k));

const CUSTOM={}; let GF=[]; let fontSel='', fontQ='';
const GF_KEY='sga.gf';
const FONT_ORDER=['Grotesk','Geometrik','Kalın','Dar','Geniş','Serif','Mono','El yazısı','Google','Özel'];
function fontGroups(){
  const cats=[]; FONTS.forEach(f=>{if(cats.indexOf(f[1])<0)cats.push(f[1])});
  cats.sort((a,b)=>FONT_ORDER.indexOf(a)-FONT_ORDER.indexOf(b));
  return cats.map(k=>({group:k,items:FONTS.filter(f=>f[1]===k).map(f=>[f[0],f[0]])}));
}
function buf2b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b642buf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
const IDB={
  db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('sga-fonts',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'name'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async tx(mode,fn){const db=this.db||(this.db=await this.open());return new Promise((res,rej)=>{const t=db.transaction('f',mode),rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx('readonly',s=>s.getAll())},
  put(o){return this.tx('readwrite',s=>s.put(o))},
  del(n){return this.tx('readwrite',s=>s.delete(n))}
};
function addFontEntry(name,cat,w){let f=FMAP[name];if(!f){f=[name,cat,w];FONTS.push(f);FMAP[name]=f}return f}
async function registerCustom(rec){
  const ff=new FontFace(rec.name,rec.data,{weight:rec.variable?'100 900':'400'});
  await ff.load(); document.fonts.add(ff); rec.ff=ff; CUSTOM[rec.name]=rec;
  addFontEntry(rec.name,'Özel',rec.variable?[400,500,700,900]:[400]);
  fitCache={}; needRender(); thumbsDirty();
}
function removeCustom(name){
  const r=CUSTOM[name]; if(!r)return;
  try{document.fonts.delete(r.ff)}catch(e){}
  delete CUSTOM[name]; const i=FONTS.findIndex(f=>f[0]===name); if(i>=0)FONTS.splice(i,1); delete FMAP[name];
  IDB.del(name).catch(()=>{}); fitCache={}; needRender();
}
function gfUrl(g){const fam=g.name.trim().replace(/\s+/g,'+');return 'https://fonts.googleapis.com/css2?family='+fam+(g.w.length>1?':wght@400;700':'')+'&display=swap'}
function injectGF(g,cb){
  const l=document.createElement('link'); l.rel='stylesheet'; l.href=gfUrl(g);
  l.onload=()=>cb&&cb(true); l.onerror=()=>{l.remove();cb&&cb(false)}; document.head.append(l);
}
async function addGoogle(name){
  name=name.trim().replace(/\s+/g,' '); if(!name)return false;
  if(FMAP[name]){fontSel=name;buildFontUI();toast('Bu yazı tipi zaten listede');return true}
  const tryW=w=>new Promise(res=>injectGF({name,w},ok=>res(ok)));
  let w=[400,700];
  let ok=await tryW(w); if(!ok){w=[400];ok=await tryW(w)}
  if(!ok){toast('“'+name+'” Google Fonts’ta bulunamadı. Adı tam yazın.',4000);return false}
  const g={name,w}; GF.push(g); addFontEntry(name,'Google',w);
  try{localStorage.setItem(GF_KEY,JSON.stringify(GF))}catch(e){}
  fontSel=name; refreshFontLists(); toast(name+' eklendi'); return true;
}
function removeGoogle(name){
  GF=GF.filter(g=>g.name!==name); try{localStorage.setItem(GF_KEY,JSON.stringify(GF))}catch(e){}
  const i=FONTS.findIndex(f=>f[0]===name); if(i>=0)FONTS.splice(i,1); delete FMAP[name];
}
async function restoreFonts(){
  try{GF=JSON.parse(localStorage.getItem(GF_KEY)||'[]')}catch(e){GF=[]}
  GF.forEach(g=>{addFontEntry(g.name,'Google',g.w);injectGF(g)});
  try{const all=await IDB.all();for(const r of all||[]){try{await registerCustom({name:r.name,data:r.data,variable:r.variable})}catch(e){}}}catch(e){}
}
function customFontsData(){return Object.keys(CUSTOM).map(k=>({name:k,variable:CUSTOM[k].variable,b64:buf2b64(CUSTOM[k].data)}))}
async function loadFontsFrom(o){
  for(const f of (o.fonts||[])){
    if(CUSTOM[f.name])continue;
    try{const data=b642buf(f.b64);await registerCustom({name:f.name,data,variable:f.variable});IDB.put({name:f.name,data,variable:f.variable}).catch(()=>{})}catch(e){}
  }
  for(const n of (o.gfonts||[])){if(!FMAP[n]){try{await addGoogle(n)}catch(e){}}}
}

$('#fileFont').addEventListener('change',async ev=>{
  const files=Array.from(ev.target.files||[]); const variable=!!($('#fontVar')&&$('#fontVar').checked);
  let ok=0, persisted=true;
  for(const f of files){
    if(!/\.(ttf|otf|woff2?|ttc)$/i.test(f.name)){toast('Desteklenmeyen dosya: '+f.name);continue}
    let name=f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').trim();
    if(FMAP[name]&&!CUSTOM[name])name+=' (özel)';
    if(CUSTOM[name])removeCustom(name);
    try{
      const data=await f.arrayBuffer();
      await registerCustom({name,data,variable});
      try{await IDB.put({name,data,variable})}catch(e){persisted=false}
      fontSel=name; ok++;
    }catch(err){toast('“'+f.name+'” okunamadı. Dosya bozuk olabilir.',4000)}
  }
  if(ok){refreshFontLists();toast(ok+' yazı tipi eklendi'+(persisted?'':'. Bu görünümde kalıcı kaydedilemedi, yalnız bu oturumda geçerli.'),persisted?2600:5000)}
});

const MAXSIDE=8192, MAXAREA=64e6;
function exScale(){
  let s=EX.scale; const w=S.page.w, hh=S.page.h;
  s=Math.min(s,MAXSIDE/Math.max(w,hh),Math.sqrt(MAXAREA/(w*hh)));
  return Math.max(.1,s);
}
function exInfo(){

  $('#exQRow').hidden=!(f==='jpg'||f==='webp'||f==='pdf');

  else if(f==='json')t='Tüm öğeleri, ızgarayı, temayı ve yüklenen görselleri içeren proje dosyası. “Proje aç” ile geri yüklenir.';
  else{t='Çıktı boyutu: '+w+' × '+hh+' px.';if(s<EX.scale-.01)t+=' Ölçek tarayıcı sınırı nedeniyle düşürüldü.';
    if(f==='pdf')t+=' PDF sayfası '+r2(S.page.w)+' × '+r2(S.page.h)+' pt; içerik yüksek çözünürlüklü resim olarak gömülür.'}

async function loadFontsForExport(){
  const jobs=[]; S.els.forEach(e=>{if(e.type==='text'){const f=fontOf(e);jobs.push(document.fonts.load((e.ital?'italic ':'')+e.weight+' 24px "'+f+'"'))}});
  try{await Promise.all(jobs);await document.fonts.ready}catch(err){}
  fitCache={};
}
function renderCanvas(scale,transparent){
  const w=Math.round(S.page.w*scale), hh=Math.round(S.page.h*scale);
  const c=document.createElement('canvas'); c.width=w; c.height=hh;
  const x=c.getContext('2d'); x.setTransform(w/S.page.w,0,0,hh/S.page.h,0,0);
  drawScene(x,S.els,{bg:!transparent,ed:false}); return c;
}
const toBlob=(c,type,q)=>new Promise(res=>c.toBlob(res,type,q));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function rasterEl(e,scale){
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(e.w*scale)); c.height=Math.max(1,Math.round(e.h*scale));
  const x=c.getContext('2d'); x.scale(c.width/e.w,c.height/e.h);
  ED=false; if(e.type==='image')drawImageEl(x,e);else drawPattern(x,e);
  return c.toDataURL(e.type==='image'?'image/jpeg':'image/png',.92);
}
function buildSVG(){
  const m=document.createElement('canvas').getContext('2d'), W=S.page.w, Hh=S.page.h, out=[];
  out.push('<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+W+'" height="'+Hh+'" viewBox="0 0 '+W+' '+Hh+'">');
  out.push('<rect width="'+W+'" height="'+Hh+'" fill="'+esc(col('bg'))+'"/>');
  S.els.forEach(e=>{
    if(e.hide)return;
    const tr='translate('+r2(e.x+e.w/2)+' '+r2(e.y+e.h/2)+')'+(e.rot?' rotate('+e.rot+')':'')+' translate('+r2(-e.w/2)+' '+r2(-e.h/2)+')';
    const op=e.op<1?' opacity="'+e.op+'"':''; let body='';
    if(e.type==='rect'){
      if(e.fill)body+='<rect width="'+r2(e.w)+'" height="'+r2(e.h)+'" rx="'+r2(Math.min(e.rad,e.w/2,e.h/2))+'" fill="'+esc(col(e.fill))+'"/>';
      if(e.stroke&&e.sw)body+='<rect x="'+e.sw/2+'" y="'+e.sw/2+'" width="'+r2(e.w-e.sw)+'" height="'+r2(e.h-e.sw)+'" rx="'+r2(Math.min(e.rad,e.w/2,e.h/2))+'" fill="none" stroke="'+esc(col(e.stroke))+'" stroke-width="'+e.sw+'"/>';
    }else if(e.type==='circle'){
      if(e.fill)body+='<ellipse cx="'+r2(e.w/2)+'" cy="'+r2(e.h/2)+'" rx="'+r2(e.w/2)+'" ry="'+r2(e.h/2)+'" fill="'+esc(col(e.fill))+'"/>';
      if(e.stroke&&e.sw)body+='<ellipse cx="'+r2(e.w/2)+'" cy="'+r2(e.h/2)+'" rx="'+r2(e.w/2-e.sw/2)+'" ry="'+r2(e.h/2-e.sw/2)+'" fill="none" stroke="'+esc(col(e.stroke))+'" stroke-width="'+e.sw+'"/>';
    }else if(e.type==='text'){
      const P=textPlan(m,e), fam=esc(fontOf(e)+', Helvetica Neue, Arial, sans-serif');
      P.items.forEach(it=>{if(it.t)body+='<text x="'+r2(it.x)+'" y="'+r2(it.y)+'" font-family="'+fam+'" font-size="'+r2(P.size)+'" font-weight="'+e.weight+'"'+(e.ital?' font-style="italic"':'')+(e.ls?' letter-spacing="'+e.ls+'"':'')+' fill="'+esc(col(e.color))+'" xml:space="preserve">'+esc(it.t)+'</text>'});
    }else if(e.type==='pattern'||(e.type==='image'&&S.imgs[e.img])){
      body='<image width="'+r2(e.w)+'" height="'+r2(e.h)+'" preserveAspectRatio="none" xlink:href="'+rasterEl(e,2)+'"/>';
    }
    if(body)out.push('<g transform="'+tr+'"'+op+'>'+body+'</g>');
  });
  out.push('</svg>'); return out.join('\n');
}
async function makePDF(jpg,pw,ph,iw,ih){
  const data=new Uint8Array(await jpg.arrayBuffer()), enc=new TextEncoder(), parts=[], off=[]; let pos=0;
  const push=u=>{parts.push(u);pos+=u.length}, str=s=>push(enc.encode(s));
  const obj=(n,b)=>{off[n]=pos;str(n+' 0 obj\n'+b+'\nendobj\n')};
  str('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4]=pos; str('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+data.length+' >>\nstream\n');
  push(data); str('\nendstream\nendobj\n');
  const content='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
  obj(5,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  const xr=pos; let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  str(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
let DL;
async function getDL(){
  if(DL!==undefined)return DL;
  try{DL=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch(err){DL=null}
  return DL;
}
async function saveFile(name,blob){
  const dl=await getDL();
  if(dl){
    try{await dl.save({filename:name,data:blob});toast('Kaydedildi: '+name);return}
    catch(err){if(err&&err.code==='declined'){toast('İndirme iptal edildi');return}if(err&&err.code==='too_large'){toast('Dosya çok büyük. Daha düşük ölçek deneyin.',4000);return}}
  }
  if(window.claude){toast('Bu görünümde indirme kullanılamıyor. Bağımsız HTML kopyasında çalışır.',5000);return}
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000); toast('İndirildi: '+name);
}
$('#exGo').onclick=async()=>{
  const go=$('#exGo'); go.disabled=true; const f=EX.fmt, base='swiss-grid-'+S.page.w+'x'+S.page.h;
  try{
    if(f==='json'){await saveFile(base+'.json',new Blob([projectJSON(true,true)],{type:'application/json'}))}
    else{
      await loadFontsForExport();
      if(f==='svg')await saveFile(base+'.svg',new Blob([buildSVG()],{type:'image/svg+xml'}));
      else{
        const s=exScale(), q=EX.q/100;
        if(f==='png'){const c=renderCanvas(s,EX.trans);await saveFile(base+'.png',await toBlob(c,'image/png'))}
        else if(f==='jpg'){const c=renderCanvas(s,false);await saveFile(base+'.jpg',await toBlob(c,'image/jpeg',q))}
        else if(f==='webp'){const c=renderCanvas(s,EX.trans);const b=await toBlob(c,'image/webp',q);
          if(b&&b.type==='image/webp')await saveFile(base+'.webp',b);else toast('Bu tarayıcı WebP üretemiyor. PNG veya JPG seçin.',4000)}
        else if(f==='pdf'){const c=renderCanvas(s,false);const jb=await toBlob(c,'image/jpeg',Math.max(q,.85));
          await saveFile(base+'.pdf',await makePDF(jb,r2(S.page.w),r2(S.page.h),c.width,c.height))}
      }
    }
  }catch(err){toast('Dışa aktarma başarısız: '+(err&&err.message||err),5000)}
  go.disabled=false;
};

/* ---------- Proje yükleme ---------- */
function loadProject(o,done){
  S.page=o.page; S.grid=Object.assign({base:0,mt:48,mr:48,mb:48,ml:48,gut:16},o.grid); S.T=o.T; S.els=o.els||[];
  S.ui=Object.assign({grid:true,snap:true},o.ui||{}); S.sel=null; S.imgs={};
  uidN=1+S.els.reduce((m,e)=>Math.max(m,parseInt(String(e.id).slice(1),10)||0),0);
  const ids=Object.keys(o.imgs||{}); let n=ids.length;
  const fin2=()=>loadFontsFrom(o).then(done,done);
  if(!n){fin2();return}
  ids.forEach(id=>{const el=new Image();
    const fin=()=>{if(--n===0)fin2()};
    el.onload=()=>{S.imgs[id]={el,url:o.imgs[id],w:el.naturalWidth,h:el.naturalHeight};fin()};
    el.onerror=fin; el.src=o.imgs[id]});
}
$('#fileProj').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.page||!o.els)throw 0;loadProject(o,()=>{commit();fitZoom();refreshAll();closeExport();toast('Proje açıldı')})}catch(err){toast('Geçerli bir proje dosyası değil')}};
  rd.readAsText(f);
});
{

}
